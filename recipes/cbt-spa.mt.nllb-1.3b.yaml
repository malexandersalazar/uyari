# NLLB-200 1.3B, full fine-tune, both directions. Fast baseline.
# Fits the 4090 with fp32 master weights + bf16 autocast; under an hour.
id: cbt-spa.mt.nllb-1.3b
build: data-2026.11
task: mt
language: cbt_Latn
primary: spa_Latn
directions: [spa>cbt, cbt>spa]
splits: {train: train, validation: validation}     # test only via `uyari eval --final`
filters: {provenance: [human]}                     # add `licenses:` once contribution licenses are set
base_model: facebook/nllb-200-distilled-1.3B
method: seq2seq
new_lang_token_init: quy_Latn                      # cbt_Latn embedding starts from Ayacucho Quechua
text_codec: {"ʼ": "'"}                             # NLLB's SentencePiece maps U+02BC to <unk>; reversed on output
train:
  epochs: 8
  lr: 1.0e-4
  optimizer: adafactor
  precision: bf16_mixed
  batch_size: 16
  grad_accum: 1
  max_len: 256
  warmup_ratio: 0.05
  seed: 7
eval:
  num_beams: 4
  max_new_tokens: 256
  batch_size: 32
output: models/mt-cbt-spa-nllb1.3b@v0.1
