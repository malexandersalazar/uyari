# Muse Glimmer 30B, QLoRA (4-bit) with Unsloth, both directions. The headline model.
# 24 GB: max length 512, batch 1, accumulation 16, gradient checkpointing (Linux + Unsloth).
id: cbt-spa.mt.glimmer-qlora
build: data-2026.11
task: mt
language: cbt_Latn
primary: spa_Latn
directions: [spa>cbt, cbt>spa]
splits: {train: train, validation: validation}
filters: {provenance: [human]}
base_model: meta-models/Muse-Glimmer-30B     # verify with scripts/check_4090.py
method: qlora
# Glimmer is image-text-to-text (MuseGlimmerForConditionalGeneration): LoRA on the language layers,
# vision frozen (Unsloth FastModel). Its ATEM chat template defaults to "Reasoning strength: high";
# translation answers directly. The same kwargs apply at training, in-process inference and on the
# server (vLLM `chat_template_kwargs`).
chat_template_kwargs: {reasoning_strength: low}
lora: {r: 16, alpha: 32, dropout: 0.0, target: all-linear, backend: unsloth}
train:
  epochs: 3
  lr: 1.0e-4
  precision: bf16
  batch_size: 1
  grad_accum: 16
  max_len: 512                  # longest prepared example: 375 Glimmer tokens (median 160)
  warmup_ratio: 0.03
  seed: 7
  optimizer: adamw_8bit
eval:
  max_new_tokens: 256
  batch_size: 8
  server_adapter: mt-cbt-spa                  # name when served by `uyari serve start`
output: models/mt-cbt-spa-glimmer30b-qlora@v0.1
