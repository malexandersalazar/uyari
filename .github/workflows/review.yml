# Gate 1 (validator + tests) on every pull request; Gate 2 (Gatekeeper on local Glimmer) on the
# self-hosted GPU runner for pull requests from this repository. Forked PRs never run on the
# self-hosted runner: a steward re-runs the Gatekeeper with workflow_dispatch after reading the diff.
name: review
on:
  pull_request:
  workflow_dispatch:
    inputs:
      contribution: {description: "languages/<lang>/contributions/<id>", required: true}
      pr: {description: "PR number to comment on", required: true}

permissions:
  contents: read
  pull-requests: write

env:
  PYTHONUTF8: "1"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.11 --extra dev --extra speech
      - name: Validator (strict; TODO license/consent fields fail here on purpose)
        run: uv run uyari validate --strict
      - run: uv run pytest -q

  gatekeeper:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, gpu]
    env:
      GH_TOKEN: ${{ github.token }}
      UV_PROJECT_ENVIRONMENT: /opt/uyari/.venv     # persistent env with the GPU extras (scripts/setup_ubuntu.sh)
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, clean: false}
      - name: Contributions touched by this PR
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ inputs.contribution }}" > changed.txt
          else
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -oE '^languages/[^/]+/contributions/[^/]+' | sort -u > changed.txt || true
          fi
          cat changed.txt
      - name: Gatekeeper review (Muse Glimmer, local) as a PR comment
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr }}"
          while read -r c; do
            [ -d "$c" ] || continue
            uv run --no-sync uyari gatekeeper --contribution "$c" --out review.md || true
            gh pr comment "$PR" --body-file review.md
          done < changed.txt
